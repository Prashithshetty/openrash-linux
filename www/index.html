<script>
  window.__openrashToggleFullscreen = function () {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openrash) {
      window.webkit.messageHandlers.openrash.postMessage("toggleFullscreen");
      return;
    }
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  };
  window.__openrashQuit = function () {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openrash) {
      window.webkit.messageHandlers.openrash.postMessage("quit");
      return;
    }
    window.close();
  };
  addEventListener("contextmenu", function (e) {
    if (!e.target || !e.target.closest || !e.target.closest("input, textarea")) e.preventDefault();
  });
</script>

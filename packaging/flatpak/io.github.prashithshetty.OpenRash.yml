app-id: io.github.prashithshetty.OpenRash
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.freedesktop.Sdk//25.08
command: openrash

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --share=network
  - --filesystem=xdg-data/openrash:create

modules:
  - name: openrash
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - dist
          - .flatpak-build
          - .flatpak-builder
